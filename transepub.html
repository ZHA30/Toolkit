<script>
(() => {
  let theme = 'auto';
  try { theme = localStorage.getItem('transepub.theme') || 'auto'; } catch {}
  document.documentElement.dataset.themePreference = theme;
  document.documentElement.dataset.theme = theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : theme;
})();
</script>

  if (menu && ['ArrowDown','ArrowUp','Home','End'].includes(event.key)) {
    event.preventDefault();
    const items = [...menu.querySelectorAll('button')], index = items.indexOf(document.activeElement);
    items[event.key === 'Home' ? 0 : event.key === 'End' ? items.length-1 : (index+(event.key === 'ArrowDown' ? 1 : items.length-1))%items.length].focus();
  }
});
$('recordsToggle').onclick = async () => {
  closeMenus(); recordsIssue = null; $('cleanupConfirm').hidden = true; $('clearAll').setAttribute('aria-expanded','false');
  try { await refreshRecords(); $('recordsDialog').showModal(); }
  catch (error) { message(error); }
};
$('closeRecords').onclick = () => $('recordsDialog').close();
$('recordsDialog').addEventListener('close',() => {
  $('recordList').querySelectorAll('img').forEach(image => URL.revokeObjectURL(image.src));
  $('recordList').replaceChildren(); $('recordsToggle').focus();
  celebrate();
});
$('clearAll').onclick = () => {
  $('cleanupConfirm').hidden = false; $('clearAll').setAttribute('aria-expanded','true'); $('keepRecords').focus();
};
$('keepRecords').onclick = () => { $('cleanupConfirm').hidden = true; $('clearAll').setAttribute('aria-expanded','false'); $('clearAll').focus(); };
$('confirmCleanup').onclick = () => deleteRecords([],true);
window.addEventListener('online',render); window.addEventListener('offline',render);
document.addEventListener('visibilitychange',celebrate);
$('confettiScript').addEventListener('load',celebrate);
window.addEventListener('popstate',async event => {
  const next = book ? event.state?.stage || 1 : 1;
  if (next !== 3) await pauseRun();
  if (next === 1) await findLatest();
  showStage(next,'none'); if (book) render();
});
applyLocale();
(async () => {
  setBusy(true);
  try {
    if (document.readyState === 'loading') await new Promise(resolve => document.addEventListener('DOMContentLoaded',resolve,{once:true}));
    await openDB(); await findLatest(); showStage(1,'replace');
    if (latest?.state === 'running') { setBusy(false); await loadBook(latest.blob,latest.name,latest); }
  } catch (error) { message('loadFailed',{error}); }
  finally { setBusy(false); }
})();

</script>
</body>
